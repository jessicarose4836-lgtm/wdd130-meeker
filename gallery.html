<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Modern Lens</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        main {
            margin: 0 40px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 10px;
        }

        .grid-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            object-fit: cover;
        }

        main::before {
            content: "";
            display: block;
            width: 100%;
            height: 3px;
            background: #F3BF6B;
            margin: 8px auto 0;
            margin-bottom: 6px;
            border-radius: 40px;
        }

        /* Optional: Make it 2 columns on mobile screens */
        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="images/logok.png" alt="logo image">
            <span>The Modern Lens</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Gallery</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main>
        <div class="grid-container" id="imageGallery">
        </div>


    </main>
    <footer>
        <p>&copy; 2025 Jessica Snedecor </p>
    </footer>
</body>
<script>
    const gallery = document.getElementById('imageGallery');

    // Loop from 1 to 29 to generate the images
    for (let i = 1; i <= 29; i++) {
        const img = document.createElement('img');
        img.src = `images/image${i}k.png`; // Generates image1k.png, image2k.png, etc.
        img.alt = `Gallery Image ${i}`;
        gallery.appendChild(img);
    }
</script>

</html>
