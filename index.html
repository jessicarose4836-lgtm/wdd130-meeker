<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Modern Lens</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="" alt="logo image">
            <span>The Modern Lens</span>
        </div>
        <nav>
            <a href="">Home</a>
            <a href="">Gallery</a>
            <a href="">About</a>
        </nav>
    </header>
    
    <main>
        <section class="hero">
            <img src="images/image1k.png" alt="The Modern Lens, a new digital modern art gallery">
            <h1>The Modern Lens</h1>
            <p>A new digital modern art gallery</p>
        </section>
        
        <h2 class="section-title">Featured Works</h2>
        <div class="card-container">
            <img class="card" src="images/image2k.png" alt="image 2">
            <img class="card" src="images/image3k.png" alt="image 3">
            <img class="card" src="images/image4k.png" alt="image 4">
        </div>

        <h2 class="section-title">Contact Us!</h2>
        <div class="contact-box">
            <form>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <br>
                <button type="submit">Reach Out!</button>
            </form>
        </div>
    </main>
    <footer>
        <!-- Add copyright here -->
    </footer>
</body>
</html>
