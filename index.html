<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Modern Lens</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="images/logok.png" alt="logo image">
            <span>The Modern Lens</span>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="">About</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>The Modern Lens</h1>
            <p>A new digital modern art gallery</p>
        </section>

        <h2 class="section-title">Featured Works</h2>
        <div class="card-container">
            <img class="card" src="images/image2k.png" alt="image 2">
            <img class="card" src="images/image3k.png" alt="image 3">
            <img class="card" src="images/image4k.png" alt="image 4">
        </div>

        <h2 class="section-title">Contact Us!</h2>
        <div class="contact-box">
            <form class="contact-form">
                <div class="input-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="text" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                </div>
                <button type="submit">Reach Out!</button>
            </form> <!-- what the actual crap is happening here? -->
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Jessica Snedecor </p>
    </footer>
</body>

</html>
